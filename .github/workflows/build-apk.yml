name: Hardened Build & Release Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # STAGE 1: Code Quality, Security, Tests & Accounting Invariants Gate
  # =========================================================================
  verify-and-test:
    name: Security, Lint, Migrations & Accounting Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 1. Dependency & Lockfile Validation
        run: |
          echo "Verifying lockfile synchronization..."
          npm ci --ignore-scripts

      - name: 2. Pre-flight Secret & Credential Scanning
        run: |
          echo "Scanning for accidentally committed credentials and private keys..."
          node scripts/scan-secrets.mjs

      - name: 3. Dependency Vulnerability Audit
        run: |
          echo "Auditing dependencies for known critical vulnerabilities..."
          npm audit --audit-level=critical || true

      - name: 4. TypeScript & Formatting Quality Check
        run: |
          echo "Running strict TypeScript type check..."
          npm run lint

      - name: 5. Unit & Core Security Tests
        run: |
          echo "Executing domain primitives and security unit tests..."
          npm run test:unit

      - name: 6. SQLite Migration & Integration Tests
        run: |
          echo "Verifying database migrations 001-010 and transactional rollback..."
          npm run test:migrations

      - name: 7. Accounting Invariants & Inventory Invariants Tests
        run: |
          echo "Verifying double-entry invariants (Debits == Credits), Khata, and stock movements..."
          npm run test:accounting

      - name: 8. Versioned Backup & Restore Verification Tests
        run: |
          echo "Verifying AES-256-GCM backup archives, checksums, and rollback safety..."
          npm run test:backups

      - name: 9. Privacy-Conscious Diagnostics Telemetry Tests
        run: |
          echo "Verifying data sanitization and zero-leakage diagnostics..."
          npx tsx --test src/core/diagnostics/PrivacyDiagnosticsService.test.ts

      - name: 10. High-Volume Business Benchmarks & Query Plan Verification
        run: |
          echo "Verifying covering indexes, keyset pagination, and query plan latency SLAs..."
          npm run test:benchmarks

      - name: 11. Production Web Bundle Build
        run: |
          echo "Building production web assets..."
          npm run build

      - name: Archive Production Web Bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # =========================================================================
  # STAGE 2: Android Build, Packaging, Protected Signing & Release
  # =========================================================================
  android-build-and-release:
    name: Android Packaging, Signing & Provenance
    needs: verify-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Semantic Version
        id: semver
        run: |
          git fetch --tags --force || true
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="0.0.1"
          else
            CLEAN_VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$CLEAN_VERSION" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_VERSION" | cut -d. -f2)
            PATCH=$(echo "$CLEAN_VERSION" | cut -d. -f3)

            PATCH=$((PATCH + 1))
            if [ "$PATCH" -ge 10 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
            fi

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Calculated new version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          echo "Syncing Capacitor with release version: $VERSION"
          npm version "$VERSION" --no-git-tag-version

          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Run Android Unit & Configuration Tests
        run: |
          cd android
          ./gradlew testReleaseUnitTest --no-daemon

      - name: Build Android Release APK
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          cd android
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode=${{ github.run_number }} --no-daemon

      - name: Sign & Align APK with Protected Secrets
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          RAW_APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Found compiled APK: $RAW_APK"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          VERSION="${{ steps.semver.outputs.version }}"
          mkdir -p release-output
          ALIGNED_APK="release-output/Cocoon-v${VERSION}-aligned.apk"
          FINAL_APK="release-output/Cocoon-v${VERSION}.apk"

          # 1. 4-byte Align APK
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$RAW_APK" "$ALIGNED_APK"

          # 2. Key Management: Use protected GitHub secret keystore if provided, else generate ephemeral runner keystore
          KEYSTORE_FILE="$RUNNER_TEMP/cocoon-signing.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using protected repository release keystore secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            SIGN_STOREPASS="$KEYSTORE_PASSWORD"
            SIGN_KEYALIAS="$KEY_ALIAS"
            SIGN_KEYPASS="$KEY_PASSWORD"
          else
            echo "Generating secure ephemeral runner keystore (no secrets committed)..."
            SIGN_STOREPASS="cocoon_ci_ephemeral_pass_$(date +%s)"
            SIGN_KEYALIAS="cocoon_release_key"
            SIGN_KEYPASS="$SIGN_STOREPASS"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$SIGN_KEYALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$SIGN_STOREPASS" \
              -keypass "$SIGN_KEYPASS" \
              -dname "CN=Cocoon Finance, OU=Security, O=Cocoon, L=San Francisco, S=CA, C=US"
          fi

          # 3. Sign APK enforcing Signature Schemes v1, v2, and v3
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass "pass:$SIGN_STOREPASS" \
            --ks-key-alias "$SIGN_KEYALIAS" \
            --key-pass "pass:$SIGN_KEYPASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          # 4. Rigorous signature verification
          echo "Verifying APK signature..."
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$FINAL_APK"
          echo "Successfully verified signature for: $FINAL_APK"

          # Clean up ephemeral or decoded keystore immediately
          rm -f "$KEYSTORE_FILE" "$ALIGNED_APK"

      - name: Generate Artifact Checksums & Provenance Metadata
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          FINAL_APK="release-output/Cocoon-v${VERSION}.apk"
          COMMIT_SHA="${{ github.sha }}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          APK_SIZE=$(stat -c%s "$FINAL_APK" 2>/dev/null || stat -f%z "$FINAL_APK")

          # Generate SHA-256 and SHA-512 Checksums
          cd release-output
          sha256sum "Cocoon-v${VERSION}.apk" > SHA256SUMS
          sha512sum "Cocoon-v${VERSION}.apk" > SHA512SUMS
          SHA256_HASH=$(cat SHA256SUMS | awk '{print $1}')
          SHA512_HASH=$(cat SHA512SUMS | awk '{print $1}')
          cd ..

          # Generate structured build-metadata.json
          cat << EOF > release-output/build-metadata.json
          {
            "application": "Cocoon Finance",
            "version": "${VERSION}",
            "versionCode": ${{ github.run_number }},
            "commitSha": "${COMMIT_SHA}",
            "gitRef": "${{ github.ref }}",
            "buildTimestamp": "${BUILD_TIME}",
            "artifact": {
              "filename": "Cocoon-v${VERSION}.apk",
              "sizeBytes": ${APK_SIZE},
              "sha256": "${SHA256_HASH}",
              "sha512": "${SHA512_HASH}"
            },
            "environment": {
              "nodeVersion": "22",
              "jdkVersion": "21",
              "minSdkVersion": 24,
              "targetSdkVersion": 34
            }
          }
          EOF

          echo "Build metadata generated successfully:"
          cat release-output/build-metadata.json

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cocoon-Release-v${{ steps.semver.outputs.version }}
          path: |
            release-output/Cocoon-v${{ steps.semver.outputs.version }}.apk
            release-output/SHA256SUMS
            release-output/SHA512SUMS
            release-output/build-metadata.json
          if-no-files-found: error

      - name: Generate Release Notes & Changelog
        run: |
          PREV_TAG="${{ steps.semver.outputs.previous_tag }}"
          VERSION="${{ steps.semver.outputs.version }}"
          TAG="${{ steps.semver.outputs.tag }}"
          COMMIT_SHA="${{ github.sha }}"
          SHA256=$(cat release-output/SHA256SUMS | awk '{print $1}')

          cat << EOF > release-body.md
          ### Cocoon Android Release ${TAG}
          - **Version**: \`${VERSION}\` (Code \`${{ github.run_number }}\`)
          - **Target API**: Android 7.0 (API 24) to Android 14/15+ (API 34/35)
          - **Commit**: \`${COMMIT_SHA}\`
          - **SHA-256 Checksum**:
            \`\`\`
            ${SHA256}  Cocoon-v${VERSION}.apk
            \`\`\`

          #### Security & Integrity Attestation
          - **Secret Scanning**: Passed (0 credentials or keys detected)
          - **Database Migrations (001-010)**: 100% verified with automatic rollback testing
          - **Double-Entry Accounting Invariants**: Debits == Credits verified
          - **Encrypted Backup & Restore**: AES-256-GCM authenticated encryption verified
          - **APK Signature**: Signed with APK Signature Scheme v2 & v3

          #### Installation:
          1. Download **Cocoon-v${VERSION}.apk** below.
          2. Verify checksum: \`sha256sum Cocoon-v${VERSION}.apk\`
          3. Tap to install on your Android device.

          EOF

          node .github/scripts/generate-release-notes.js "$PREV_TAG" "changelog-part.md" || true
          if [ -f "changelog-part.md" ]; then
            cat changelog-part.md >> release-body.md
          fi

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: Release ${{ steps.semver.outputs.tag }}
          generate_release_notes: false
          body_path: release-body.md
          files: |
            release-output/Cocoon-v${{ steps.semver.outputs.version }}.apk
            release-output/SHA256SUMS
            release-output/SHA512SUMS
            release-output/build-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
