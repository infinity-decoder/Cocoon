changelog:
  categories:
    - title: "🚀 Features & Enhancements"
      labels:
        - "feature"
        - "enhancement"
        - "feat"
    - title: "🐛 Bug Fixes & Stability"
      labels:
        - "bug"
        - "fix"
        - "bugfix"
    - title: "🔄 Maintenance & Updates"
      labels:
        - "chore"
        - "dependencies"
        - "documentation"
        - "docs"
        - "*"
  exclude:
    labels:
      - "ignore"
      - "skip-changelog"
